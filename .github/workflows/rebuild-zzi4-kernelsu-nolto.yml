name: Rebuild ZZI4 KernelSU no-LTO

on:
  push:
    branches:
      - zzi4-kernelsu-enoexec-fix
    paths:
      - .github/workflows/rebuild-zzi4-kernelsu-nolto.yml
      - .github/zzi4-kernelsu-rebuild-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zzi4-kernelsu-enoexec-fix
  cancel-in-progress: false

env:
  TARGET: pa3q-S938BXXUCZZI4
  TARGET_RELEASE: 6.6.127-android15-8-p33f4ffe-abogkiS938BXXUCZZI4-4k
  KSU_REPO: https://github.com/tiann/KernelSU.git
  KSU_TAG_SHA: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
  MODULE_NAME: android15-6.6_kernelsu-pa3q-S938BXXUCZZI4-kdp-v3.3.0.ko
  KSUD_NAME: ksud-pa3q-S938BXXUCZZI4-kdp-v3.3.0
  ARTIFACT_DIR: artifacts/pa3q-S938BXXUCZZI4-v0300

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          ref: zzi4-kernelsu-enoexec-fix
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Prepare patched KernelSU 3.3.0
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/KernelSU"
          git clone --filter=blob:none "$KSU_REPO" "$RUNNER_TEMP/KernelSU"
          cd "$RUNNER_TEMP/KernelSU"
          git checkout --detach "$KSU_TAG_SHA"
          test "$(git rev-parse HEAD)" = "$KSU_TAG_SHA"
          test "$((30000 + $(git rev-list --count HEAD)))" -eq 32601
          git apply "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch"
          python3 "$GITHUB_WORKSPACE/kernelsu/patches/apply-v330-staged-daemon-hotfix.py"

      - name: Build upstream-shaped no-LTO ZZI4 module
        run: |
          set -euo pipefail
          docker pull ghcr.io/ylarod/ddk-min:android15-6.6-20260828
          docker run --rm --privileged \
            -v "$RUNNER_TEMP/KernelSU:/work/KernelSU" \
            -e TARGET_RELEASE="$TARGET_RELEASE" \
            ghcr.io/ylarod/ddk-min:android15-6.6-20260828 \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work/KernelSU
              export PATH="$(ls -d /opt/ddk/clang/*/bin | head -1):$PATH"
              export ARCH=arm64 LLVM=1 LLVM_IAS=1
              cd /work/KernelSU
              test -n "${KDIR:-}"
              test -d "$KDIR"
              mkdir -p "$KDIR/include/config" "$KDIR/include/generated"
              printf "%s\n" "$TARGET_RELEASE" > "$KDIR/include/config/kernel.release"
              printf "#define UTS_RELEASE \"%s\"\n" "$TARGET_RELEASE" > "$KDIR/include/generated/utsrelease.h"
              cd kernel
              make -C "$KDIR" M="$PWD" src="$PWD" clean || true
              make -C "$KDIR" M="$PWD" src="$PWD" \
                CONFIG_KSU=m \
                CONFIG_KSU_SAMSUNG_KDP=y \
                CONFIG_KSU_SAMSUNG_RKP=y \
                CONFIG_KSU_SAMSUNG_DEFEX=y \
                CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
                CONFIG_LTO_CLANG= \
                CONFIG_LTO_CLANG_THIN= \
                CONFIG_LTO_NONE=y \
                KBUILD_MODPOST_WARN=1 \
                modules -j"$(nproc)"
              test -s kernelsu.ko
              echo "=== module file ==="
              file kernelsu.ko
              echo "=== ELF header ==="
              readelf -h kernelsu.ko | grep -E "Class:|Machine:|Type:"
              echo "=== important sections ==="
              readelf -SW kernelsu.ko | grep -E "__versions|\.BTF|\.BTF\.ext|\.llvm|\.modinfo" || true
              echo "=== vermagic ==="
              modinfo -F vermagic kernelsu.ko 2>/dev/null || strings kernelsu.ko | grep -m1 -F "$TARGET_RELEASE"
              echo "=== size/hash ==="
              stat -c "%s" kernelsu.ko
              sha256sum kernelsu.ko
              test "$(stat -c %s kernelsu.ko)" -gt 1000000
              readelf -h kernelsu.ko | grep -Fq "Machine:                           AArch64"
              strings kernelsu.ko | grep -Fq "$TARGET_RELEASE"
              readelf -SW kernelsu.ko | grep -q "__versions"
              if readelf -SW kernelsu.ko | grep -Eq "\.llvm\.lto|\.llvm_bc"; then
                echo "Unexpected LLVM LTO payload remains in module" >&2
                exit 1
              fi
            '
          cp "$RUNNER_TEMP/KernelSU/kernel/kernelsu.ko" "kernelsu/$MODULE_NAME"
          test -s "kernelsu/$MODULE_NAME"

      - name: Build KernelSU 3.3.0 ksud with unstripped no-LTO module
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cd "$RUNNER_TEMP/KernelSU"
          test "$((30000 + $(git rev-list --count HEAD)))" -eq 32601
          mkdir -p userspace/ksud/bin/aarch64
          cp "$GITHUB_WORKSPACE/kernelsu/$MODULE_NAME" \
             userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo clean -p ksud
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/ksud/Cargo.toml
          cp "target/$TRIPLE/release/ksud" "$GITHUB_WORKSPACE/kernelsu/$KSUD_NAME"
          test -s "$GITHUB_WORKSPACE/kernelsu/$KSUD_NAME"
          strings "$GITHUB_WORKSPACE/kernelsu/$KSUD_NAME" | grep -F '32601' | head -n 1

      - name: Update ZZI4 feed metadata and checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path.cwd()
          manifest_path = root / 'support/targets-v3.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          target = [p for p in manifest['payloads'] if p['payloadId'] == os.environ['TARGET']]
          if len(target) != 1:
              raise SystemExit('Expected exactly one ZZI4 target')
          target = target[0]

          module = root / 'kernelsu' / os.environ['MODULE_NAME']
          ksud = root / 'kernelsu' / os.environ['KSUD_NAME']
          exploit = root / os.environ['ARTIFACT_DIR'] / 'cve-2026-43499-app.so'
          helper = root / os.environ['ARTIFACT_DIR'] / 'cve-2026-43499-root'

          def meta(path):
              data = path.read_bytes()
              return len(data), hashlib.sha256(data).hexdigest()

          ksud_size, ksud_sha = meta(ksud)
          target['kernelsu']['size'] = ksud_size
          target['kernelsu']['sha256'] = ksud_sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          rows = []
          for path in (exploit, helper, module, ksud):
              size, digest = meta(path)
              rows.append(f'{digest}  {path.relative_to(root).as_posix()}')
              print(f'{path.relative_to(root)} size={size} sha256={digest}')
          (root / os.environ['ARTIFACT_DIR'] / 'SHA256SUMS').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          PY

      - name: Validate feed and artifact shape
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_feed.py
          module="kernelsu/$MODULE_NAME"
          test "$(stat -c %s "$module")" -gt 1000000
          readelf -h "$module" | grep -Fq 'AArch64'
          readelf -SW "$module" | grep -q '__versions'
          strings "$module" | grep -Fq "$TARGET_RELEASE"
          git diff --check

      - name: Publish fix branch artifacts
        run: |
          set -euo pipefail
          git config user.name 'Root My Galaxy'
          git config user.email 'root-my-galaxy@users.noreply.github.com'
          git add \
            "kernelsu/$MODULE_NAME" \
            "kernelsu/$KSUD_NAME" \
            "$ARTIFACT_DIR/SHA256SUMS" \
            support/targets-v3.json
          if git diff --cached --quiet; then
            echo 'No artifact changes.'
            exit 0
          fi
          git commit -m 'Rebuild ZZI4 KernelSU as unstripped no-LTO module'
          git push origin HEAD:zzi4-kernelsu-enoexec-fix
