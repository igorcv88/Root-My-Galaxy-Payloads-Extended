name: Atualizar Payloads

# Target-agnostic payload publication.
#
# The set of buildable targets lives in .github/build-targets.json, never in
# this file. A run rebuilds only the targets it selects and republishes only
# those feed entries; every other target keeps its validated artifacts.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target (payloadId) ou 'all'"
        required: true
        default: "all"
        type: string
      atualizar:
        description: "O que você alterou?"
        required: true
        default: "Exploit"
        type: choice
        options:
          - "Exploit"
          - "KernelSU"
          - "Exploit + KernelSU"

permissions:
  contents: write

env:
  KSU_REPO: https://github.com/tiann/KernelSU.git
  KSU_TAG_SHA: 932014ab5b2c9b74a3d11e2ec4d17dd10fc9442e
  KSU_EXPECTED_VERSION: "32601"

jobs:
  plan:
    name: Selecionar targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fixar revisão de origem
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolver seleção
        id: plan
        env:
          TARGET_SELECTION: ${{ inputs.target }}
          UPDATE_MODE: ${{ inputs.atualizar }}
        run: python3 .github/scripts/plan_targets.py

  build:
    name: Gerar ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - name: Preparar Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Testar política mínima do exploit
        if: matrix.buildExploit
        run: make TARGET="$TARGET" host-test

      - name: Gerar exploit e root helper
        if: matrix.buildExploit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make clean
          make TARGET="$TARGET" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          make TARGET="$TARGET" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            "build/$TARGET/cve-2026-43499-root"

      - name: Verificar artefatos do target
        if: matrix.buildExploit
        run: python3 .github/scripts/verify_build.py "$TARGET"

      - name: Preparar KernelSU
        if: matrix.buildKernelSu
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/KernelSU"
          git clone --filter=blob:none "$KSU_REPO" "$RUNNER_TEMP/KernelSU"
          cd "$RUNNER_TEMP/KernelSU"
          git checkout --detach "$KSU_TAG_SHA"
          test "$(git rev-parse HEAD)" = "$KSU_TAG_SHA"
          test "$((30000 + $(git rev-list --count HEAD)))" -eq "$KSU_EXPECTED_VERSION"
          git apply "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-v3.3.0-samsung-kdp-rkp-defex.patch"
          python3 "$GITHUB_WORKSPACE/kernelsu/patches/apply-v330-staged-daemon-hotfix.py"

      - name: Ler configuração KernelSU do target
        if: matrix.buildKernelSu
        id: ksu
        run: |
          python3 .github/scripts/kernelsu_config.py "$TARGET" >> "$GITHUB_OUTPUT"

      - name: Gerar módulo KernelSU
        if: matrix.buildKernelSu
        env:
          TARGET_RELEASE: ${{ steps.ksu.outputs.kernelRelease }}
          DDK_IMAGE: ${{ steps.ksu.outputs.ddkImage }}
          MODULE_NAME: ${{ steps.ksu.outputs.moduleName }}
        run: |
          set -euo pipefail
          docker pull "$DDK_IMAGE"
          docker run --rm --privileged \
            -v "$RUNNER_TEMP/KernelSU:/work/KernelSU" \
            -e TARGET_RELEASE="$TARGET_RELEASE" \
            "$DDK_IMAGE" \
            bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work/KernelSU
              cd /work/KernelSU
              test -n "${KDIR:-}"
              test -d "$KDIR"
              mkdir -p "$KDIR/include/config" "$KDIR/include/generated"
              printf "%s\n" "$TARGET_RELEASE" > "$KDIR/include/config/kernel.release"
              printf "#define UTS_RELEASE \"%s\"\n" "$TARGET_RELEASE" > "$KDIR/include/generated/utsrelease.h"
              cd kernel
              make clean || true
              CONFIG_KSU=m \
              CONFIG_KSU_SAMSUNG_KDP=y \
              CONFIG_KSU_SAMSUNG_RKP=y \
              CONFIG_KSU_SAMSUNG_DEFEX=y \
              CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
              CC=clang make -j"$(nproc)"
              llvm-strip -d kernelsu.ko
            '
          test -s "$RUNNER_TEMP/KernelSU/kernel/kernelsu.ko"
          mkdir -p "dist/$TARGET"
          cp "$RUNNER_TEMP/KernelSU/kernel/kernelsu.ko" "dist/$TARGET/$MODULE_NAME"

      - name: Gerar ksud
        if: matrix.buildKernelSu
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          MODULE_NAME: ${{ steps.ksu.outputs.moduleName }}
          KSUD_NAME: ${{ steps.ksu.outputs.ksudName }}
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          cd "$RUNNER_TEMP/KernelSU"
          test "$((30000 + $(git rev-list --count HEAD)))" -eq "$KSU_EXPECTED_VERSION"
          mkdir -p userspace/ksud/bin/aarch64
          cp "$GITHUB_WORKSPACE/dist/$TARGET/$MODULE_NAME" \
             userspace/ksud/bin/aarch64/android15-6.6_kernelsu.ko
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo clean -p ksud
          cargo build --target "$TRIPLE" --release \
            --manifest-path ./userspace/ksud/Cargo.toml
          cp "target/$TRIPLE/release/ksud" \
            "$GITHUB_WORKSPACE/dist/$TARGET/$KSUD_NAME"
          test -s "$GITHUB_WORKSPACE/dist/$TARGET/$KSUD_NAME"
          strings "$GITHUB_WORKSPACE/dist/$TARGET/$KSUD_NAME" \
            | grep -F "$KSU_EXPECTED_VERSION" | head -n 1

      - name: Reunir artefatos do target
        run: |
          set -euo pipefail
          mkdir -p "dist/$TARGET"
          if [ "${{ matrix.buildExploit }}" = "true" ]; then
            cp "build/$TARGET/cve-2026-43499-app.release.so" "dist/$TARGET/"
            cp "build/$TARGET/cve-2026-43499-root" "dist/$TARGET/"
          fi
          ls -l "dist/$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.id }}
          path: dist/${{ matrix.id }}
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publicar feed
    needs: [plan, build]
    runs-on: ubuntu-latest
    # Global: only one run may ever rewrite the feed and push to main.
    concurrency:
      group: publish-payload-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0

      - name: Confirmar que main não mudou durante o build
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "::error::main avançou de $SOURCE_SHA para $current durante o build; abortando publicação de artefatos obsoletos. Reexecute o workflow."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: payload-*

      - name: Normalizar diretório de artefatos
        run: |
          set -euo pipefail
          for directory in dist/payload-*; do
            mv "$directory" "dist/$(basename "$directory" | sed 's/^payload-//')"
          done
          find dist -type f | sort

      - name: Atualizar artefatos e feed
        id: publish
        env:
          UPDATE_MODE: ${{ inputs.atualizar }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          DIST_DIR: dist
        run: python3 .github/scripts/publish_targets.py

      - name: Verificar resultado
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_feed.py
          git diff --check

      - name: Publicar no repositório
        env:
          UPDATE_MODE: ${{ inputs.atualizar }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          CHANGED_PATHS: ${{ steps.publish.outputs.paths }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"

          git add support/targets-v3.json
          for path in $CHANGED_PATHS; do
            git add "$path"
          done

          if git diff --cached --quiet; then
            echo "Nenhum arquivo mudou. Nada para publicar."
            exit 0
          fi

          git fetch origin main
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "::error::main avançou para $current antes da publicação; os artefatos foram gerados de $SOURCE_SHA. Reexecute o workflow."
            exit 1
          fi

          git commit -m "Update payloads ($TARGETS): $UPDATE_MODE"
          python3 .github/scripts/validate_feed.py
          git push origin HEAD:main
