name: PR36 ZZI4 build and publish artifacts

on:
  push:
    branches:
      - fix/zzi4-bounded-fops-retry

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build and verify ZZI4
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TARGET: pa3q-S938BXXUCZZI4
        run: |
          set -euo pipefail
          make TARGET="$TARGET" host-test
          make clean
          make TARGET="$TARGET" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" release
          make TARGET="$TARGET" ANDROID_NDK_HOME="$ANDROID_NDK_HOME" "build/$TARGET/cve-2026-43499-root"
          test "$(stat -c%s "build/$TARGET/cve-2026-43499-app.release.so")" -eq 104128
          strings "build/$TARGET/cve-2026-43499-app.release.so" | grep -F "fops trigger did not fire; retrying"
          strings "build/$TARGET/cve-2026-43499-app.release.so" | grep -F "write landed; refusing further fops retries"
          if strings "build/$TARGET/cve-2026-43499-app.release.so" | grep -Fq "stack writer ran; refusing retry on this boot"; then
            echo "stale single-shot guard is still present" >&2
            exit 1
          fi

      - name: Refresh checked-in ZZI4 artifacts and metadata
        env:
          TARGET: pa3q-S938BXXUCZZI4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          root = Path('.')
          target = 'pa3q-S938BXXUCZZI4'
          artifact_dir = root / 'artifacts/pa3q-S938BXXUCZZI4-v0300'
          built = root / 'build' / target
          exploit = artifact_dir / 'cve-2026-43499-app.so'
          helper = artifact_dir / 'cve-2026-43499-root'
          shutil.copy2(built / 'cve-2026-43499-app.release.so', exploit)
          shutil.copy2(built / 'cve-2026-43499-root', helper)

          def meta(path: Path):
              data = path.read_bytes()
              return len(data), hashlib.sha256(data).hexdigest()

          exploit_size, exploit_sha = meta(exploit)
          helper_size, helper_sha = meta(helper)
          if exploit_size != 104128:
              raise SystemExit(f'unexpected padded ZZI4 exploit size: {exploit_size}')

          manifest_path = root / 'support/targets-v3.json'
          manifest = json.loads(manifest_path.read_text())
          feed = next(item for item in manifest['payloads'] if item['payloadId'] == target)
          feed['exploit']['size'] = exploit_size
          feed['exploit']['sha256'] = exploit_sha
          feed['rootHelper']['size'] = helper_size
          feed['rootHelper']['sha256'] = helper_sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          (artifact_dir / 'cve-2026-43499-root.sha256').write_text(
              f'{helper_sha}  cve-2026-43499-root\n'
          )

          sums_path = artifact_dir / 'SHA256SUMS'
          updates = {
              exploit.relative_to(root).as_posix(): exploit_sha,
              helper.relative_to(root).as_posix(): helper_sha,
          }
          out = []
          seen = set()
          for raw in sums_path.read_text().splitlines():
              parts = raw.split(None, 1)
              if len(parts) == 2 and parts[1].strip() in updates:
                  rel = parts[1].strip()
                  out.append(f'{updates[rel]}  {rel}')
                  seen.add(rel)
              else:
                  out.append(raw)
          for rel in sorted(set(updates) - seen):
              out.append(f'{updates[rel]}  {rel}')
          sums_path.write_text('\n'.join(out) + '\n')

          print(f'ZZI4 exploit: {exploit_size} bytes {exploit_sha}')
          print(f'ZZI4 helper:  {helper_size} bytes {helper_sha}')
          PY
          python3 .github/scripts/validate_feed.py
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: pr36-zzi4-verified
          path: |
            build/pa3q-S938BXXUCZZI4/cve-2026-43499-app.release.so
            build/pa3q-S938BXXUCZZI4/cve-2026-43499-root
          retention-days: 3
          if-no-files-found: error

      - name: Commit verified artifacts
        run: |
          set -euo pipefail
          git config user.name "Root My Galaxy"
          git config user.email "root-my-galaxy@users.noreply.github.com"
          git rm .github/workflows/pr36-zzi4-build.yml
          git add support/targets-v3.json \
                  artifacts/pa3q-S938BXXUCZZI4-v0300/cve-2026-43499-app.so \
                  artifacts/pa3q-S938BXXUCZZI4-v0300/cve-2026-43499-root \
                  artifacts/pa3q-S938BXXUCZZI4-v0300/cve-2026-43499-root.sha256 \
                  artifacts/pa3q-S938BXXUCZZI4-v0300/SHA256SUMS
          git commit -m "Publish verified ZZI4 bounded-retry payload"
          git push origin HEAD:fix/zzi4-bounded-fops-retry
